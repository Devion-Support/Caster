name: Supply chain

on:
  push:
    branches: ["main", "libso"]
  pull_request:
    branches: ["main", "libso"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-submission:
    name: Submit Gradle dependency graph
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Submit dependency graph
        uses: gradle/actions/dependency-submission@v5

  build-sbom:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Generate SBOM
        run: ./gradlew --no-daemon :app:cyclonedxBom

      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@v4
        with:
          name: caster-cyclonedx-sbom
          path: |
            app/build/reports/bom.json
            app/build/reports/bom.xml
          if-no-files-found: error

  verify-release:
    name: Build and attest release APKs
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Install Android build dependencies
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Build release APKs
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Upload release APKs
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: caster-release-apks
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attest APK build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: app/build/outputs/apk/release/*.apk
