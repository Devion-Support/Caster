name: Android

on:
  push:
    branches: ["main", "libso", "upgrade/**"]
  pull_request:
    branches: ["main", "libso"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Install Android build dependencies
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Normalize Gradle wrapper permissions
        run: chmod +x ./gradlew

      - name: Validate and test
        run: ./gradlew --no-daemon check -x :lib:testDebugUnitTest

      - name: Build release APKs
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: caster-release-apks
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
